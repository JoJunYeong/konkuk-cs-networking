<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">학교 밖에서, 우리 다시 만나요. KU meet</title>
<desc id="desc">건국 컴공 선후배 네트워킹. 2026년 9월 17일 19시, 홍대입구 인근. 참가비 10,000원.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#edf8f1"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
<rect x="58" y="43" width="46" height="46" rx="15" fill="#d6efe1"/>
<text x="71" y="76" fill="#147d59" font-size="32" font-weight="800">K</text>
<text x="117" y="76" fill="#172c25" font-size="30" font-weight="800" letter-spacing="-1.5">KU meet</text>
<text x="1138" y="71" fill="#62726a" font-size="18" text-anchor="end">건국 컴공 네트워킹</text>
<text x="600" y="171" fill="#147d59" font-size="20" font-weight="600" text-anchor="middle">2026 Q3 · 선배의 요즘, 후배의 고민, 그리고 내 이야기</text>
<text x="600" y="266" fill="#172c25" font-size="70" font-weight="800" letter-spacing="-3" text-anchor="middle">학교 밖에서,</text>
<text x="600" y="352" fill="#147d59" font-size="70" font-weight="800" letter-spacing="-3" text-anchor="middle">우리 다시 만나요.</text>
<rect x="134" y="418" width="932" height="112" rx="24" fill="#fff" stroke="#dce7e0"/>
<text x="185" y="458" fill="#62726a" font-size="15">언제</text>
<text x="185" y="493" fill="#172c25" font-size="23" font-weight="700">9월 17일(목) · 19:00</text>
<path d="M510 446v56M801 446v56" stroke="#dce7e0"/>
<text x="560" y="458" fill="#62726a" font-size="15">어디서</text>
<text x="560" y="493" fill="#172c25" font-size="23" font-weight="700">홍대입구 인근</text>
<text x="850" y="458" fill="#62726a" font-size="15">참가비</text>
